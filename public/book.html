<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book your visit | Durian City Farm</title>
<meta name="description" content="Book a farm tour with durian tasting, buy durian for dine in or take away, or arrange a farm learning visit at Durian City Farm, Bandar Seri Alam, Johor Bahru.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400&family=Jost:wght@300;400;500&family=Quicksand:wght@400&display=swap" rel="stylesheet">
<style id="dcf-css">:root{
  --night:#1F1712;--night-2:#2A1F18;--walnut:#3B2C22;--brown:#523F31;
  --brass:#B48C57;--brass-soft:#D7B27A;--cream:#EFE6D8;--cream-muted:#B9AA97;
  --glass:rgba(239,230,216,.06);--glass-2:rgba(239,230,216,.1);--line:rgba(239,230,216,.16);
  --ok:#8FB07A;--warn:#C98A5A;--off:#6E6052;
  --serif:"Crimson Pro","Iowan Old Style",Georgia,serif;
  --round:"Quicksand","Jost","Century Gothic",system-ui,sans-serif;
  --sans:"Jost","Futura","Century Gothic",system-ui,-apple-system,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#1F1712;--cream:#EFE6D8}}
:root[data-theme="dark"]{--night:#1F1712;--cream:#EFE6D8}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:radial-gradient(ellipse 60% 40% at 85% 0%,rgba(214,160,96,.12),transparent 70%),var(--night);color:var(--cream);font-family:var(--sans);font-weight:300;font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:clamp(1.1rem,4vw,2.5rem);padding-right:clamp(1.1rem,4vw,2.5rem)}
.eyebrow{display:inline-block;font-weight:500;font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);border:1px solid currentColor;border-radius:999px;padding:.34rem .8rem .3rem 1rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(31,23,18,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(239,230,216,.08)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:.8rem;height:70px}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;min-width:0}
.badge{display:flex;align-items:center;justify-content:center;flex:none;width:46px;height:46px;border-radius:50%;background:var(--walnut);box-shadow:inset 0 0 0 1px rgba(180,140,87,.55)}
.badge img{width:68%}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text b{font-family:var(--round);font-weight:400;text-transform:uppercase;letter-spacing:.2em;font-size:.86rem;white-space:nowrap}
.brand-text i{font-family:var(--serif);font-weight:300;color:var(--brass);font-size:.82rem;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:.45rem;flex:none}
.back{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;font-size:.85rem;color:var(--cream-muted);border:1px solid var(--line);border-radius:999px;padding:.45rem .85rem}
.back:hover{color:var(--cream);border-color:var(--cream)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{font-size:.72rem;font-weight:500;letter-spacing:.12em;color:var(--cream-muted);background:none;border:0;border-radius:999px;padding:.36rem .58rem;cursor:pointer;line-height:1}
.lang button[aria-pressed="true"]{background:var(--brass);color:var(--night)}
@media (max-width:560px){.back .lbl,.brand-text i{display:none}.brand-text b{font-size:.72rem;letter-spacing:.14em}.badge{width:40px;height:40px}}

/* intro */
.intro{padding:clamp(2.5rem,6vw,4.5rem) 0 clamp(1.5rem,3vw,2.5rem)}
.intro h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.05;margin:1.1rem 0 .8rem}
.intro p{color:var(--cream-muted);max-width:38em;margin:0}

/* layout */
.layout{display:grid;grid-template-columns:1fr 360px;gap:clamp(1rem,3vw,2rem);align-items:start;padding-bottom:5rem}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
.step{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:clamp(1.2rem,2.6vw,1.8rem);margin-bottom:clamp(.8rem,2vw,1.2rem)}
.step-h{display:flex;align-items:baseline;gap:.8rem;margin-bottom:1.1rem}
.step-h .n{font-family:var(--serif);font-size:1.8rem;line-height:1;color:var(--brass)}
.step-h h2{font-family:var(--serif);font-weight:400;font-size:1.45rem;margin:0;line-height:1.2}
.hint{font-size:.85rem;color:var(--cream-muted);margin:-.4rem 0 1rem}

/* experiences */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:.95rem 1rem;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(239,230,216,.4)}
.opt[aria-checked="true"]{border-color:var(--brass);background:rgba(180,140,87,.14)}
.opt[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--cream-muted);margin-top:.2rem;display:grid;place-items:center}
.opt[aria-checked="true"] .dot{border-color:var(--brass)}
.opt[aria-checked="true"] .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--brass)}
.opt b{display:block;font-weight:400;font-size:1rem}
.opt small{display:block;color:var(--cream-muted);font-size:.8rem;line-height:1.4;margin-top:.15rem}
.opt .tag{display:inline-block;margin-top:.4rem;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.events-note{margin:1rem 0 0;font-size:.88rem;color:var(--cream-muted)}
.events-note a{color:var(--cream);text-decoration-color:var(--brass);text-underline-offset:.25em}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.cal-head h3{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin:0}
.nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn svg{width:18px;height:18px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.dow span{text-align:center;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-muted);padding-bottom:.3rem}
.day{position:relative;aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:.95rem;padding:0}
.day small{font-size:.52rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cream-muted);line-height:1}
.day.avail{border-color:rgba(143,176,122,.55)}
.day.avail::after{content:"";position:absolute;bottom:14%;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.day.avail:hover{background:var(--glass-2)}
.day.na{color:var(--off);border-color:transparent;background:rgba(239,230,216,.025);cursor:not-allowed}
.day.full{color:var(--cream-muted);border-color:rgba(201,138,90,.45);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(201,138,90,.09) 6px 12px)}
.day.closed{color:var(--off);border-color:transparent;cursor:not-allowed;text-decoration:line-through}
.day.sel{background:var(--brass);border-color:var(--brass);color:var(--night);font-weight:500}
.day.sel small{color:var(--night)}
.day.sel::after{display:none}
.day.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin-top:1rem;font-size:.78rem;color:var(--cream-muted)}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg-a{border:1px solid rgba(143,176,122,.7)}
.lg-f{border:1px solid rgba(201,138,90,.7);background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(201,138,90,.3) 3px 6px)}
.lg-n{background:rgba(239,230,216,.08)}
.lg-s{background:var(--brass)}
.season-note{margin:.9rem 0 0;font-size:.84rem;color:var(--cream-muted)}

/* time + form */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:.6rem 1.1rem;cursor:pointer;font-size:.92rem}
.chip[aria-checked="true"]{background:var(--brass);border-color:var(--brass);color:var(--night)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media (max-width:620px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:.35rem}
.field.full{grid-column:1/-1}
.field label{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--cream);background:rgba(239,230,216,.05);border:1px solid var(--line);border-radius:8px;padding:.75rem .85rem;font-size:1rem;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field select option{background:#2A1F18;color:var(--cream)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.stepper button{width:46px;height:46px;background:rgba(239,230,216,.05);border:0;cursor:pointer;font-size:1.2rem}
.stepper output{min-width:56px;text-align:center;font-size:1.05rem}

/* summary */
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);background:linear-gradient(180deg,rgba(82,63,49,.55),rgba(42,31,24,.75));border:1px solid rgba(180,140,87,.45);border-radius:14px;padding:clamp(1.3rem,2.6vw,1.8rem)}
@media (max-width:960px){.summary{position:static}}
.summary h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0 0 1rem}
.summary dl{margin:0 0 1.2rem}
.summary dl div{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-top:1px solid var(--line);font-size:.92rem}
.summary dt{color:var(--cream-muted);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;padding-top:.2rem}
.summary dd{margin:0;text-align:right}
.summary dd.empty{color:var(--off)}
.send{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:1rem 1.2rem;border:0;border-radius:999px;background:var(--brass);color:var(--night);font-size:1rem;font-weight:500;cursor:pointer;text-decoration:none}
.send:hover{background:var(--brass-soft)}
.send[aria-disabled="true"]{background:rgba(239,230,216,.12);color:var(--cream-muted);cursor:not-allowed}
.send svg{width:20px;height:20px}
.missing{margin:.7rem 0 0;font-size:.8rem;color:var(--warn);min-height:1.2em}
.fine{margin:1rem 0 0;font-size:.78rem;color:var(--cream-muted);line-height:1.5}

/* owner panel */
.owner{display:none;border:1px dashed rgba(180,140,87,.6);border-radius:12px;padding:1.2rem 1.3rem;margin-bottom:1.2rem;background:rgba(180,140,87,.07)}
.owner.on{display:block}
.owner h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:0 0 .4rem}
.owner p{font-size:.86rem;color:var(--cream-muted);margin:0 0 .9rem}
.owner .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.9rem}
.mode{border:1px solid var(--line);background:none;border-radius:999px;padding:.45rem .9rem;cursor:pointer;font-size:.85rem}
.mode[aria-pressed="true"]{background:var(--cream);color:var(--night)}
.mchips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.9rem}
.mchip{border:1px solid var(--line);background:none;border-radius:6px;padding:.35rem .55rem;font-size:.78rem;cursor:pointer}
.mchip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--night)}
.save{border:0;border-radius:999px;background:var(--cream);color:var(--night);padding:.65rem 1.2rem;cursor:pointer;font-weight:500}
.save:disabled{opacity:.5;cursor:default}
.owner .status{font-size:.82rem;color:var(--cream-muted);margin-left:.4rem}
.editing .day{cursor:pointer!important}

.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:30;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab svg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.day{aspect-ratio:auto;height:clamp(42px,6vw,54px)}
@media (min-width:961px){.days,.dow{max-width:560px}.cal-head{max-width:560px}}
.slot-note{flex-basis:100%;margin:.5rem 0 0;font-size:.82rem;color:var(--cream-muted)}
.stepper input{width:64px;height:46px;text-align:center;font:inherit;font-size:1.05rem;color:var(--cream);background:transparent;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;background:rgba(239,230,216,.06)}
.big-group{background:rgba(201,138,90,.12);border:1px solid rgba(201,138,90,.5);border-radius:10px;padding:1rem 1.1rem}
.big-group[hidden]{display:none}
.big-group p{margin:0 0 .8rem;font-size:.92rem}
.btn-wa{display:inline-flex;align-items:center;gap:.5rem;background:#25D366;color:#0E2A17;text-decoration:none;font-weight:500;border-radius:999px;padding:.6rem 1.1rem;font-size:.92rem}
.btn-wa svg{width:18px;height:18px}
.ack{flex-direction:row!important;align-items:flex-start;gap:.7rem;cursor:pointer;font-size:.95rem;line-height:1.45;background:rgba(180,140,87,.1);border:1px solid rgba(180,140,87,.4);border-radius:10px;padding:.9rem 1rem}
.ack input{width:20px;height:20px;flex:none;margin:.1rem 0 0;accent-color:var(--brass)}
.pay{border-color:rgba(180,140,87,.5)}
.pay-lead{color:var(--cream-muted);font-size:.92rem;margin:-.3rem 0 1.2rem}
.pay-grid{display:grid;grid-template-columns:auto 1fr;gap:clamp(1rem,3vw,2rem);align-items:start}
@media (max-width:620px){.pay-grid{grid-template-columns:1fr}}
.qr{margin:0;text-align:center}
.qr img{width:min(240px,70vw);height:auto;border-radius:14px;background:#fff;display:block;margin:0 auto}
.qr figcaption{font-size:.78rem;color:var(--cream-muted);margin-top:.6rem;max-width:240px;margin-left:auto;margin-right:auto}
.bank-h{margin:0 0 .6rem;font-family:var(--serif);font-size:1.2rem}
.bank dl{margin:0}
.bank dl div{padding:.65rem 0;border-top:1px solid var(--line)}
.bank dt{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-muted)}
.bank dd{margin:.15rem 0 0;font-size:1.02rem}
.accno{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.accno span{font-size:1.3rem;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.copy{border:1px solid var(--line);background:none;border-radius:999px;padding:.35rem .85rem;font-size:.8rem;cursor:pointer}
.copy:hover{border-color:var(--cream)}
.ref{font-size:.85rem;color:var(--cream-muted);margin:.9rem 0 .3rem}
.receipt{font-size:.88rem;color:var(--brass-soft);margin:0}
.summary dd a{color:var(--cream);text-decoration-color:var(--brass);text-underline-offset:.25em}

.qr img{width:min(300px,78vw)}
.qr figcaption{max-width:300px}
.amt{display:flex;align-items:baseline;flex-wrap:wrap;gap:.4rem .9rem;background:rgba(180,140,87,.14);border:1px solid rgba(180,140,87,.5);border-radius:10px;padding:.9rem 1.1rem;margin:0 0 1.3rem}
.amt span{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-muted)}
.amt b{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1;color:var(--cream)}
.amt small{font-size:.85rem;color:var(--cream-muted)}
.summary .dep{font-weight:500;color:var(--brass-soft);font-size:1.05rem}
.upload{margin-top:1.4rem;border-top:1px solid var(--line);padding-top:1.2rem}
.up-title{font-family:var(--serif);font-size:1.2rem;margin:0 0 .7rem}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;text-align:center;border:1.5px dashed rgba(180,140,87,.7);border-radius:12px;padding:1.6rem 1rem;cursor:pointer;background:rgba(180,140,87,.07);transition:background .2s,border-color .2s}
.drop:hover,.drop.over{background:rgba(180,140,87,.15);border-color:var(--brass-soft)}
.pay-grid.locked{filter:grayscale(1) blur(7px);opacity:.35;pointer-events:none;user-select:none;-webkit-user-select:none}
.pay-lock{margin:1rem 0 0;padding:.75rem 1rem;border:1px dashed rgba(180,140,87,.7);border-radius:10px;background:rgba(180,140,87,.08);font-size:.92rem;color:var(--cream)}
.pay-lock[hidden]{display:none}
.fields.locked{opacity:.4;filter:grayscale(1);pointer-events:none;user-select:none;-webkit-user-select:none}
#fields-lock{margin:0 0 1rem}
.drop.locked,.drop.locked:hover{opacity:.45;filter:grayscale(1);cursor:not-allowed;background:rgba(180,140,87,.07);border-color:rgba(180,140,87,.7)}
.drop input,.up-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop:focus-within{outline:2px solid var(--brass);outline-offset:3px}
.drop-ic svg{width:30px;height:30px;color:var(--brass-soft)}
.drop-t{font-size:.98rem}
.drop small{font-size:.78rem;color:var(--cream-muted)}
.up-file{display:flex;gap:1rem;align-items:center;border:1px solid rgba(143,176,122,.6);background:rgba(143,176,122,.08);border-radius:12px;padding:.8rem}
.up-file img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:#fff}
.up-file .pdf{width:72px;height:72px;border-radius:8px;flex:none;display:grid;place-items:center;background:rgba(239,230,216,.12);font-weight:500;letter-spacing:.1em}
.up-meta{min-width:0;flex:1}
.up-meta b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-meta small{display:block;color:var(--ok);font-size:.8rem;margin-top:.15rem}
.up-act{display:flex;gap:.4rem;margin-top:.5rem}
.up-btn{position:relative;border:1px solid var(--line);background:none;border-radius:999px;padding:.3rem .8rem;font-size:.8rem;cursor:pointer}
.up-btn:hover{border-color:var(--cream)}
.up-err{color:var(--warn);font-size:.85rem;margin:.6rem 0 0}
.sent-note{margin:.8rem 0 0;font-size:.85rem;color:var(--brass-soft);background:rgba(180,140,87,.12);border-radius:8px;padding:.7rem .8rem}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.chip.nodate:disabled{opacity:.5;text-decoration:none}
/* experience cards with photos */
.opt{flex-direction:column;gap:0;padding:0;overflow:hidden}
.opt-img{display:block;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--night-2)}
.opt-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.opt:hover .opt-img img{transform:scale(1.03)}
.opt[aria-disabled="true"] .opt-img img{filter:grayscale(.6) brightness(.8)}
.opt-body{display:flex;gap:.8rem;align-items:flex-start;padding:.9rem 1rem 1rem}
.opt[aria-checked="true"] .opt-img{box-shadow:inset 0 -3px 0 var(--brass)}
@media (max-width:620px){
  .opt{flex-direction:row;align-items:stretch}
  .opt-img{width:104px;flex:none;aspect-ratio:auto;min-height:100%}
  .opt-body{padding:.85rem .9rem}
}
.open-from{display:block;color:var(--brass-soft);font-weight:400;margin-bottom:.25rem}
.of-input{font:inherit;color:var(--cream);background:rgba(239,230,216,.06);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;color-scheme:dark}
@media (prefers-reduced-motion:reduce){.opt-img img{transition:none}}
/* photos behind text, like the website tiles */
.opt{position:relative;display:block;min-height:clamp(170px,18vw,210px);padding:0;overflow:hidden;isolation:isolate}
.opt-img{position:absolute;inset:0;width:auto;aspect-ratio:auto;z-index:-2;background:var(--night-2)}
.opt-img img{width:100%;height:100%;object-fit:cover}
.opt::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(31,23,18,.05) 0%,rgba(31,23,18,.55) 45%,rgba(31,23,18,.92) 100%)}
.opt-body{position:absolute;left:0;right:0;bottom:0;padding:1rem 1.05rem 1.05rem}
.opt small{color:#E3D7C5}
.opt .tag{color:#EBCF97}
.opt .dot{border-color:#EFE6D8;background:rgba(31,23,18,.35)}
.opt[aria-checked="true"]{box-shadow:0 0 0 2px var(--brass)}
.opt[aria-checked="true"] .opt-img{box-shadow:none}
@media (max-width:620px){
  .opt{display:block;min-height:170px}
  .opt-img{width:auto;min-height:0}
  .opt-body{padding:.9rem .95rem}
}
/* form + whatsapp actions */
.form-note{margin:.7rem 0 .9rem;font-size:.82rem;color:var(--cream-muted);text-align:center}
.copy-det{display:block;width:100%;border:1px solid var(--line);background:none;border-radius:999px;padding:.7rem 1rem;cursor:pointer;font-size:.9rem;margin-bottom:.6rem}
.copy-det:hover{border-color:var(--cream)}
.wa-alt{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.88rem;color:var(--cream-muted);text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:.25em;padding:.3rem}
.wa-alt svg{width:16px;height:16px}
.var-note{font-size:.78rem;color:var(--cream-muted);margin-top:.15rem}
.field select option:disabled{color:#7E7064}
.auto-copied{margin:-.3rem 0 .9rem;font-size:.85rem;color:var(--ok);text-align:center;background:rgba(143,176,122,.1);border-radius:8px;padding:.55rem .7rem}
.auto-copied[hidden]{display:none}
.chip.blocked{text-decoration:none}
.day.partial::before{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.slot-pick{font-size:.86rem;color:var(--brass-soft);margin:0 0 1rem}
.slot-ed{margin:0 0 1.1rem}
.slot-ed>p{margin:0 0 .5rem;font-size:.9rem;color:var(--cream)}
.slot-row{display:flex;flex-wrap:wrap;gap:.4rem}
.slot-tg{display:flex;flex-direction:column;align-items:center;gap:.1rem;min-width:92px;border:1px solid rgba(143,176,122,.6);background:rgba(143,176,122,.1);border-radius:10px;padding:.5rem .7rem;cursor:pointer}
.slot-tg b{font-weight:400;font-size:.9rem}
.slot-tg small{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
.slot-tg[aria-pressed="true"]{border-color:rgba(201,138,90,.7);background:rgba(201,138,90,.14)}
.slot-tg[aria-pressed="true"] small{color:var(--warn)}
.prod-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.4rem;margin-bottom:1rem}
.prod-tg{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;border:1px solid rgba(143,176,122,.6);background:rgba(143,176,122,.1);border-radius:10px;padding:.55rem .75rem;cursor:pointer}
.prod-tg b{font-weight:400;font-size:.86rem;line-height:1.3}
.prod-tg small{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
.prod-tg[aria-pressed="false"]{border-color:rgba(201,138,90,.7);background:rgba(201,138,90,.14)}
.prod-tg[aria-pressed="false"] small{color:var(--warn)}
.prod-tg.var{border-style:dashed}
.slot-date{display:flex;align-items:center;gap:.6rem;margin:0 0 1rem;flex-wrap:wrap}
.slot-date span{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-muted)}
.slot-date input{font:inherit;color:var(--cream);background:rgba(239,230,216,.06);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;color-scheme:dark;font-size:1rem}
.apply{border:0;border-radius:999px;background:var(--brass);color:var(--night);padding:.5rem 1.1rem;font-weight:500;cursor:pointer}
.marked{display:grid;gap:.7rem;margin:0 0 1.1rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:10px;background:rgba(239,230,216,.03)}
.marked p{margin:0 0 .35rem;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-muted)}
.mk-row{display:flex;flex-wrap:wrap;gap:.35rem}
.mk-chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:.25rem .3rem .25rem .7rem}
.mk-x{width:22px;height:22px;border-radius:50%;border:0;background:rgba(239,230,216,.1);cursor:pointer;line-height:1;font-size:.95rem}
.mk-x:hover{background:rgba(201,138,90,.35)}
.marked .none{font-size:.82rem;color:var(--off)}
/* header aligned with the main website */
.top{background:rgba(31,23,18,.9)}
.top .wrap{max-width:1360px;height:72px;gap:1rem}
.badge{width:50px;height:50px}
.badge img{width:68%}
.brand-text{gap:.15rem}
.brand-text b{font-family:var(--round);font-weight:400;text-transform:uppercase;letter-spacing:.2em;font-size:.92rem}
.brand-text i{font-style:italic;font-size:.86rem}
.nav{display:flex;gap:1rem;list-style:none;margin:0;padding:0}
.nav a{position:relative;display:block;padding:.4rem 0;text-decoration:none;font-size:.8rem;color:var(--cream-muted);white-space:nowrap}
.nav a:hover{color:var(--cream)}
.nav a.active{color:var(--cream)}
.nav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--brass)}
.wa-ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--cream)}
.wa-ic svg{width:18px;height:18px}
@media (min-width:1261px) and (max-width:1380px){.nav{gap:.75rem}.nav a{font-size:.76rem}}
@media (max-width:1260px){
  .top .wrap{flex-wrap:wrap;height:auto;row-gap:0;padding-top:.5rem}
  .brand{height:52px}
  .nav{order:3;flex:0 0 auto;gap:.4rem;width:calc(100% + 2 * clamp(1.1rem,4vw,2.5rem));margin:0 calc(-1 * clamp(1.1rem,4vw,2.5rem));
    padding:.45rem clamp(1.1rem,4vw,2.5rem) .7rem;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent)}
  .nav::-webkit-scrollbar{display:none}
  .nav li{flex:none}
  .nav a{font-size:.85rem;padding:.42rem .95rem;border:1px solid var(--line);border-radius:999px}
  .nav a.active{background:var(--brass);border-color:var(--brass);color:var(--night)}
  .nav a.active::after{display:none}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 124px)}
  .summary{top:calc(env(safe-area-inset-top,0px) + 132px)}
}
@media (max-width:560px){.brand-text i{display:block}.brand-text b{font-size:.78rem;letter-spacing:.14em}.brand-text i{font-size:.76rem}.badge{width:44px;height:44px}}
@media (max-width:380px){.wa-ic{display:none}}
/* footer, same as the main website */
.foot{background:var(--night);border-top:1px solid rgba(239,230,216,.08);padding:2.5rem 0 calc(2.5rem + 60px)}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap;max-width:1360px}
.foot .badge{width:58px;height:58px}
.foot small{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:500;line-height:1.8}
.foot small a{color:inherit;white-space:nowrap}
.soc-icons{display:flex;gap:.45rem}
.soc-icons a{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--cream);transition:border-color .2s}
.soc-icons a:hover{border-color:var(--cream)}
.soc-icons svg{width:17px;height:17px}
.layout{padding-bottom:3.5rem}

/* server version */
button.send{font:inherit;font-weight:500;font-size:1rem;width:100%}
button.send:disabled{background:rgba(239,230,216,.12);color:var(--cream-muted);cursor:not-allowed}
button.send[aria-busy="true"]{background:var(--brass);color:var(--night);opacity:.8;cursor:progress}
.done{text-align:center}
.done-ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:rgba(143,176,122,.18);color:var(--ok);font-size:1.6rem;margin-bottom:.6rem}
.done h2{margin:0 0 .8rem}
.done-ref-l{margin:0;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-muted)}
.done-ref{font-family:var(--serif);font-size:1.7rem;letter-spacing:.04em;margin:.2rem 0 .8rem;color:var(--brass-soft)}
.done p{font-size:.92rem}
.done .send{margin:1rem 0 .6rem}
</style>
</head>

function takeFile(f){
  if (!f || !slotChosen()) return;
  if (!/^image\//.test(f.type) && f.type!=="application/pdf"){ st.receiptErr=t("upType"); renderReceipt(); return; }
  if (f.size > MAX_MB*1048576){ st.receiptErr=t("upTooBig"); renderReceipt(); return; }
  st.receipt=f; st.receiptErr=""; st.receiptUrl="";
  if (/^image\//.test(f.type)){ var r=new FileReader(); r.onload=function(){ st.receiptUrl=r.result; renderReceipt(); }; r.readAsDataURL(f); }
  renderReceipt(); renderSummary();

function submitBooking(){
  if (st.submitting || missing()) return;
  st.submitting=true; st.err=""; renderSummary();
  var e=expDef(st.exp), fd=new FormData();
  fd.append("experience", st.exp); fd.append("date", st.date); fd.append("slot", String(st.time));
  fd.append("name", st.name.trim()); fd.append("phone", st.phone.trim()); fd.append("people", String(st.people));

  fd.append("receipt", st.receipt, st.receipt.name);

  .then(function(res){

function loadAvailability(){

function missing(){

  }; });
  var dd=document.getElementById("day-date"), da=document.getElementById("day-apply");
  if (dd) dd.onchange=function(ev){ owner.dayDate=ev.target.value; };
  if (da) da.onclick=function(){ var v=dd.value; if(!v) return; owner.dayDate=v; var d=fromKey(v); st.view=new Date(d.getFullYear(),d.getMonth(),1); toggleDay(v); };
  el.querySelectorAll(".mk-x").forEach(function(b){ b.onclick=function(){
    var k=b.dataset.k, kind=b.dataset.kind;
    if (kind==="slots") delete DATA.slotsOff[k]; else { var a=DATA[kind], i=a.indexOf(k); if(i>-1) a.splice(i,1); }
    owner.dirty=true; renderOwner(); renderCal(); renderTimes(); renderSummary();
  }; });
  var sd=document.getElementById("slot-date");
  if (sd) sd.onchange=function(ev){ var v=ev.target.value; if(!v) return; owner.slotDate=v; var d=fromKey(v); st.view=new Date(d.getFullYear(),d.getMonth(),1); renderOwner(); renderCal(); };
  el.querySelectorAll(".slot-tg").forEach(function(b){ b.onclick=function(){
    var k=owner.slotDate, i=+b.dataset.i, a=DATA.slotsOff[k]||[], at=a.indexOf(i);
    if (at>-1) a.splice(at,1); else a.push(i);
    a.sort(); if (a.length) DATA.slotsOff[k]=a; else delete DATA.slotsOff[k];
    if (st.date===k && st.time===i) st.time=null;
    owner.dirty=true; renderOwner(); renderCal(); renderTimes(); renderSummary();
  }; });
  document.getElementById("of-input").onchange=function(ev){ if(ev.target.value){ DATA.openFrom=ev.target.value; owner.dirty=true; if(st.date && st.date<DATA.openFrom) st.date=null; renderOwner(); renderCal(); renderSummary(); } };
}
function dayPicker(){
  return '<p class="slot-pick">'+t("dayPick")+'</p><div class="slot-date"><span>'+t("slotPickDate")+'</span><input type="date" id="day-date" min="'+key(minDate)+'" max="'+key(maxDate)+'" value="'+(owner.dayDate||"")+'"><button type="button" class="apply" id="day-apply">'+t("apply")+'</button></div>';
}
function markedLists(){
  var todayKey=key(today);
  function chips(list, kind){
    var a=list.filter(function(k){return k>=todayKey;}).sort();
    if (!a.length) return '<span class="none">'+t("none")+'</span>';
    return a.map(function(k){ return '<span class="mk-chip">'+fmtDate(k)+'<button type="button" class="mk-x" data-kind="'+kind+'" data-k="'+k+'" aria-label="'+t("removeMark")+' '+fmtDate(k)+'">×</button></span>'; }).join("");
  }
  var slotDates=Object.keys(DATA.slotsOff).filter(function(k){return k>=todayKey && DATA.slotsOff[k].length;}).sort();
  return '<div class="marked"><div><p>'+t("fullList")+'</p><div class="mk-row">'+chips(DATA.full,"full")+'</div></div>'+
    '<div><p>'+t("closedList")+'</p><div class="mk-row">'+chips(DATA.closed,"closed")+'</div></div>'+
    '<div><p>'+t("slotList")+'</p><div class="mk-row">'+(slotDates.length?slotDates.map(function(k){ return '<span class="mk-chip">'+fmtDate(k)+' · '+DATA.slotsOff[k].map(function(i){return t("slots")[i];}).join(", ")+'<button type="button" class="mk-x" data-kind="slots" data-k="'+k+'" aria-label="'+t("removeMark")+'">×</button></span>'; }).join(""):'<span class="none">'+t("none")+'</span>')+'</div></div></div>';
}
function slotEditor(){
  var picker='<p class="slot-pick">'+t("slotPick")+'</p><label class="slot-date"><span>'+t("slotPickDate")+'</span><input type="date" id="slot-date" min="'+key(minDate)+'" max="'+key(maxDate)+'" value="'+(owner.slotDate||"")+'"></label>';
  if (!owner.slotDate) return picker;
  return picker+'<div class="slot-ed"><p>'+t("slotFor").replace("{d}",fmtDate(owner.slotDate))+'</p><div class="slot-row">'+
    T.en.slots.map(function(x,i){ var off=slotBlocked(owner.slotDate,i); return '<button type="button" class="slot-tg" data-i="'+i+'" aria-pressed="'+off+'"><b>'+t("slots")[i]+'</b><small>'+(off?t("slotClosedL"):t("slotOpenL"))+'</small></button>'; }).join("")+
    '</div></div>';
}
function toggleDay(k){
  if (owner.editing==="slots"){ owner.slotDate=k; renderOwner(); renderCal(); return; }
  ["full","closed"].forEach(function(n){ var a=DATA[n], i=a.indexOf(k); if(i>-1) a.splice(i,1); });
  if (owner.editing==="full") DATA.full.push(k);
  if (owner.editing==="closed") DATA.closed.push(k);
  if (st.date===k) st.date=null;
  owner.dirty=true; renderOwner(); renderCal(); renderSummary();
}
function buildDocument(){
  var todayKey=key(today);
  var so={}; Object.keys(DATA.slotsOff).forEach(function(k){ if(k>=todayKey && DATA.slotsOff[k].length) so[k]=DATA.slotsOff[k].slice().sort(); });
  var data={openFrom:DATA.openFrom,productsOff:DATA.productsOff.slice(),varietiesOff:DATA.varietiesOff.slice(),slotsOff:so,seasonMonths:DATA.seasonMonths.slice().sort(function(a,b){return a-b;}),
            full:DATA.full.filter(function(k){return k>=todayKey;}).sort(),
            closed:DATA.closed.filter(function(k){return k>=todayKey;}).sort()};
  var json=JSON.stringify(data).replace(/</g,"\\u003c");
  var S="<"+"/script>";
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n"+document.getElementById("dcf-head").textContent+"<style id=\"dcf-css\">"+document.getElementById("dcf-css").textContent+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n"+
    "<script type=\"text/plain\" id=\"dcf-head\">"+document.getElementById("dcf-head").textContent+S+"\n"+
    "<script type=\"text/plain\" id=\"dcf-logo\">"+LOGO+S+"\n"+
    "<script type=\"text/plain\" id=\"dcf-qr\">"+QR+S+"\n"+
    "<script type=\"application/json\" id=\"dcf-imgs\">"+JSON.stringify(IMGS)+S+"\n"+
    "<script type=\"application/json\" id=\"dcf-data\">"+json+S+"\n"+
    "<script id=\"dcf-app\">"+document.getElementById("dcf-app").textContent+S+"\n</body>\n</html>\n";
}
function save(){
  if (!artifactNs || !owner.dirty) return;
  var btn=document.getElementById("save"), stEl=document.getElementById("ostatus");
  btn.disabled=true; stEl.textContent=t("saving");
  artifactNs.publish(buildDocument()).then(function(){ owner.dirty=false; stEl.textContent=t("saved"); })
  .catch(function(err){
    var c=err&&err.code;
    if (c==="conflict") return;
    if (c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="not_declared"){ stEl.textContent=t("readonly"); owner.can=false; setTimeout(function(){renderOwner();renderCal();},1800); return; }
    btn.disabled=false; stEl.textContent=(err&&err.message)||"Error";
  });
}

function renderAll(){ renderShell(); }
function applyHash(){
  var h=(location.hash||"").slice(1);
  var e=expDef(h);
  if (e && !expOff(h)){ st.exp=h; st.date=null; jumpToFirstAvailable(); }
}
applyHash();
renderAll();
loadAvailability();
/* Pick up admin changes while the page is open: on return to the tab and every 2 minutes. */
document.addEventListener("visibilitychange",function(){ if(!document.hidden) loadAvailability(); });
setInterval(function(){ if(!document.hidden) loadAvailability(); },120000);
window.addEventListener("hashchange",function(){ applyHash(); renderAll(); });

if (window.claude && typeof window.claude.use==="function"){
  Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function(r){
    var user=r[0]; artifactNs=r[1];
    if (!user || !artifactNs) return;
    return user.canEdit().then(function(ok){ owner.can=!!ok; renderOwner(); });
  }).catch(function(){});
}
})();
</script>
</body>
</html>
